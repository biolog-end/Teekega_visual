<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Chat Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/markov.css">
</head>
<body>
    <div id="app">
        <div id="upload-screen" class="screen active"></div>
        <div id="mode-screen" class="screen"></div>
        <div id="viz-barchart" class="screen"></div>
        <div id="viz-linerace" class="screen"></div>
        <div id="viz-heatmap" class="screen"></div>
        <div id="viz-punchcard" class="screen"></div>
        <div id="viz-balance" class="screen"></div>
        <div id="viz-ngram" class="screen"></div>
        <div id="viz-bubble" class="screen"></div>
        <!-- <div id="viz-versus" class="screen"></div> -->
        <div id="viz-markov" class="screen"></div>
        <div id="viz-openwords" class="screen"></div>
    </div>

    <script src="upload.js"></script>
    <script src="barchart.js"></script>
    <script src="linerace.js"></script>
    <script src="heatmap.js"></script>
    <script src="punchcard.js"></script>
    <script src="balance.js"></script>
    <script src="ngram.js"></script>
    <script src="bubble.js"></script>
    <!-- <script src="versus.js"></script> -->
    <script src="markov.js"></script>
    <script src="openwords.js"></script>
    <script src="app.js"></script>
</body>
</html>
